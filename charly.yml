charly-openwebui:
    candy:
        description: |-
            Metadata concept candy owning the charly-openwebui skills whose names have no namesake candy (openwebui chat-frontend image). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the openwebui concept candy's skill entities are present and generated into the marketplace's openwebui/skills
              id: charly-openwebui-present
              context:
                - build
              command: "true"

openwebui-layer-skill:
    skill:
        name: openwebui-layer
        family: openwebui
        owner: charly-openwebui
        description: |-
            Open WebUI with auto-configured LLM providers, MCP servers, and Jupyter code execution.
            MUST be invoked before any work involving: the openwebui candy, Open WebUI configuration,
            LLM provider auto-detection, or MCP server discovery for Open WebUI.
